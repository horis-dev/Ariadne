# Vulnerability name
cve_name = "gitlab14xss"

# Predefined files
final_attack = ""
server_state = "predefined/gitlab14xss_state.bin"
depended_state = "predefined/gitlab14xss_state.bin"
api_dependency = "predefined/api_dependency_model.bin"
seed_input = "predefined/gitlab14xss_initseeds.bin"
init_wordlib = "predefined/init_wordlib.bin"
target_wordlib = "predefined/target_wordlib.bin"

# Fuzz parameters
fuzz_batch_size = 1

# Executor parameters
max_executor_numbers = 4  # Maximum number of scenarios that can be started
status_code_200_only = true  # Keep only requests with 200 status code
hc_pre_wait = 80  # Wait time before scenario start
hc_max_retries = 12  # Max retries if scenario start fails
hc_interval = 4  # Retry interval when scenario start fails

# Field dependency graph parameters
optional_api_mutation_probability = 0
init_wordlib_mutation_probability = 0
p_use_dependency = 0.99  # Probability of selecting Position from the dependency graph (otherwise select itself)
p_local_wordlib = 0.99   # Priority coefficient for choosing values from local corpus during mutation (max 1)
p_target_wordlib = 1  # Priority coefficient for choosing values from target corpus (max 1)

# API dependency graph parameters
h = "exp(-10*x)"
b = 1.0
ratio = "1:0:1"  # response : file : database
static_state_satisfiability = "1:6:0"  # static : state_diff : satisfiability

HAVOC_CYCLES_INIT = 2  # Base cycle count for deterministic mutations (default 1024)
HAVOC_CYCLES = 8  # Base cycle count for non-deterministic mutations (default 8192)
min_weight = -1
max_weight = -1
cooling_schedule = "SAN_EXP"  # Temperature calculation method, default SAN_EXP
t_x = 10.0  # Time threshold to enter next phase
MAX_FACTOR = 2  # Factor used when computing weights
SKIP_TO_NEW_PROB = 99  # Assumed probability to skip, expressed as 99%
havoc_div = 2  # Mainly influenced by the execution speed of the target program
