services:
  yapi:
    image: vulhub/yapi:1.9.2
    ports:
    - "0:3000"
    volumes:
    - ./config.json:/usr/config.json
    environment:
    - MONGO_ADDR=mongo:27017
  mongo:
    image: mongo:5.0.6
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
      MONGO_INITDB_DATABASE: yapi
    ports:
      - "0:27017"
